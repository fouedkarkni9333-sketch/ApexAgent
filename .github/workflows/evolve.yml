name: Autonomous Self-Evolution Loop

on:
  schedule:
    # يعمل تلقائياً كل 30 دقيقة (يمكنك تغيير 30 إلى 15 أو 60)
    - cron: '*/30 * * * *'
  workflow_dispatch: # يسمح لك بتشغيله يدوياً بضغطة زر متى شئت

permissions:
  contents: write # صلاحية الكتابة وحفظ التعديلات في المستودع

jobs:
  evolve-job:
    runs-on: ubuntu-latest

    steps:
      - name: سحب أحدث نسخة من المستودع
        uses: actions/checkout@v4

      - name: إعداد بيئة بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت مكتبة Gemini
        run: pip install google-generativeai

      - name: تشغيل الوكيل الذاتي
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent.py

      - name: حفظ التطور الجديد في المستودع (Git Commit & Push)
        run: |
          git config --local user.email "agent@autonomous.ai"
          git config --local user.name "Autonomous Evolution Agent"
          git add target_app.py memory.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🧬 Auto-Evolution: Upgrade code & memory" && git push)
